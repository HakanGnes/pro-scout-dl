name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proscout
          POSTGRES_PASSWORD: proscout
          POSTGRES_DB: proscout_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proscout -d proscout_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://proscout:proscout@localhost:5432/proscout_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ml,app]"
      # CPU-only PyTorch keeps CI small; the GNN tests skip themselves when torch is missing.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install torch_geometric
      - run: pytest -q
