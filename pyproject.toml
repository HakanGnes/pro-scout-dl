[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-scout-dl"
version = "0.1.0"
description = "Graph- and sequence-based deep learning for football scouting, transfer and tactics simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "ijson>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "networkx>=3.0",
    "scipy>=1.10",
]
# PyTorch: on Windows/macOS PyPI ships the CPU build; for an NVIDIA GPU install torch first
# with the command from https://pytorch.org/get-started/locally/ and then this extra.
dl = [
    "torch>=2.2",
    "torch_geometric>=2.5",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["etl*", "features*", "models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
